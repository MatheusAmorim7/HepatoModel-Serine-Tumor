name: Reproduce poster controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --out-dir results_ci
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-checks-and-figures
          path: |
            results_ci/checks.json
            results_ci/objective_checks.csv
            results_ci/*.png
            results_ci/*.pdf
